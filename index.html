<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OdontoClinic - Gestão de Consultório Odontológico</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24"><path d="M12 2C9.5 2 8 3 6.5 3S3 2.5 3 6c0 3 1 5 1.5 8 .4 2.6.8 8 3 8 1.8 0 2-4 2.5-6 .3-1.2.8-2 2-2s1.7.8 2 2c.5 2 .7 6 2.5 6 2.2 0 2.6-5.4 3-8 .5-3 1.5-5 1.5-8 0-3.5-2-3-3.5-3S14.5 2 12 2z"/></svg>
        </div>
        <div>
          <div class="brand-name" id="brandName">OdontoClinic</div>
          <div class="brand-sub">Gestão Odontológica</div>
        </div>
      </div>
      <nav class="nav" id="nav">
        <a data-view="dashboard" class="active"><span class="ico" data-icon="dashboard"></span>Visão geral</a>
        <a data-view="patients"><span class="ico" data-icon="users"></span>Pacientes</a>
        <a data-view="agenda"><span class="ico" data-icon="calendar"></span>Agenda</a>
        <a data-view="finance"><span class="ico" data-icon="money"></span>Financeiro</a>
        <a data-view="settings"><span class="ico" data-icon="settings"></span>Configurações</a>
      </nav>
      <div class="sidebar-footer">
        <div class="today-box">
          <div class="today-label">Hoje</div>
          <div class="today-date" id="todayDate"></div>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="btn-icon menu-toggle" id="menuToggle" title="Menu e visão geral"><span data-icon="more"></span></button>
        <div>
          <h1 id="pageTitle">Painel</h1>
          <p id="pageSubtitle" class="muted">Visão geral do consultório</p>
        </div>
        <div class="topbar-clock" id="topbarClock" aria-live="polite">
          <div class="topbar-clock-date" id="liveDate"></div>
          <div class="topbar-clock-time" id="liveClock">00:00:00</div>
        </div>
        <div class="topbar-actions">
          <div class="search-global">
            <span data-icon="search"></span>
            <input type="text" id="globalSearch" placeholder="Buscar paciente por nome, CPF ou telefone...">
            <div class="search-results" id="searchResults"></div>
          </div>
          <button class="btn btn-primary" id="quickNewPatient"><span data-icon="plus"></span>Novo paciente</button>
          <button class="btn-icon" id="overviewMenuBtn" title="Visão geral do consultório"><span data-icon="more"></span></button>
        </div>
      </header>

      <section class="content" id="content"></section>
    </main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h2 id="modalTitle"></h2>
        <button class="btn-icon" id="modalClose" title="Fechar"><span data-icon="close"></span></button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>

  <script src="js/app.js"></script>
</body>
</html>
